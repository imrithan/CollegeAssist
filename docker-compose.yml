version: '3.8'

services:
  backend:
    build: ./backend
    container_name: collegeassist-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=collegeassist-jwt-super-secret-key-2026
      - NODE_ENV=production
      - LLM_API_KEY=
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: collegeassist-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
