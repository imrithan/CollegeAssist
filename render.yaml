services:
  # Backend Express API Service
  - type: web
    name: collegeassist-api
    env: node
    rootDir: backend
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_API_KEY
        sync: false

  # Frontend Vite Static Site
  - type: web
    name: collegeassist-client
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: collegeassist-api
          type: web
          property: host
